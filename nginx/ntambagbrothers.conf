# /etc/nginx/sites-available/ntambagbrothers.conf
# Replace ntambagbrothers.org and your-vps-ip with your actual domain/IP

server {
    listen 80;
    listen [::]:80;
    server_name ntambagbrothers.org www.ntambagbrothers.org;

    # Maximum file upload size (for image uploads via /api/upload)
    client_max_body_size 25M;

    # Gzip compression for high performance
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
